[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "transitive GTK macro dependency; no maintained replacement is available in the current Tauri Linux stack" },
  { id = "RUSTSEC-2025-0075", reason = "transitive urlpattern dependency from Tauri; unmaintained status only, tracked for upstream removal" },
  { id = "RUSTSEC-2025-0080", reason = "transitive urlpattern dependency from Tauri; unmaintained status only, tracked for upstream removal" },
  { id = "RUSTSEC-2025-0081", reason = "transitive urlpattern dependency from Tauri; unmaintained status only, tracked for upstream removal" },
  { id = "RUSTSEC-2025-0098", reason = "transitive urlpattern dependency from Tauri; unmaintained status only, tracked for upstream removal" },
  { id = "RUSTSEC-2025-0100", reason = "transitive urlpattern dependency from Tauri; unmaintained status only, tracked for upstream removal" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib"
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
