name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm bindings
      - name: Reject generated binding drift
        run: git diff --exit-code -- src/bindings
      - run: pnpm check
      - run: pnpm test
      - run: pnpm acceptance:validate
      - run: pnpm portability:validate
      - run: pnpm packaging:validate
      - run: pnpm licenses:check
      - run: pnpm rust:test
      - name: Run desktop Clippy
        run: pnpm desktop:lint 2>&1 | tee desktop-clippy.log
      - name: Publish desktop Clippy diagnostics
        if: failure()
        run: |
          tail -80 desktop-clippy.log | while IFS= read -r line; do
            message=${line//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error::$message"
          done
      - name: Run desktop tests
        run: pnpm desktop:test 2>&1 | tee desktop-test.log
      - name: Publish desktop test diagnostics
        if: failure()
        run: |
          tail -80 desktop-test.log | while IFS= read -r line; do
            message=${line//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error::$message"
          done
      - run: pnpm build

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: cargo deny --manifest-path src-tauri/Cargo.toml check
