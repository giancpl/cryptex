[package]
name = "cryptex"
version = "0.1.0"
description = "Local-first LaTeX environment for cryptography papers"
authors = ["CrypTex contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "cryptex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cryptex-core = { path = "crates/cryptex-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace]
members = ["crates/cryptex-core"]
