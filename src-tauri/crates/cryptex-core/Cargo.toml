[package]
name = "cryptex-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
libc = "0.2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
ts-rs = { version = "11", features = ["serde-compat"] }
zstd = "0.13"
